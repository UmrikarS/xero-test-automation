[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    ui: UI tests requiring Playwright + a live Xero Demo Company login
    api: API tests against the real Xero API (Demo Company)
    security: SQL injection tests against the local vulnerable-vs-safe demo app
addopts = -v --tb=short
